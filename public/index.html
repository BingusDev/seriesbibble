<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Series Bible</title>
  <meta name="theme-color" content="#f7f3ea">
  <script>
    // Apply the saved or system theme before first paint so night draft never flashes white.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('sb-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <meta name="description" content="A word processor for writing TV and film series bibles.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/vendor/quill/quill.snow.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/relmap.css">
  <link rel="stylesheet" href="/css/history.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">§</span><span class="brand-text">Series Bible</span></a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="topbar-actions" id="topbar-actions"></div>
    <button class="icon-btn theme-btn" id="theme-btn" type="button"></button>
    <div class="account" id="account"></div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" hidden></aside>
    <main class="main" id="main"><div class="loading" aria-live="polite"><span class="brand-mark" aria-hidden="true">§</span><span>Opening your binder…</span></div></main>
    <aside class="rightbar" id="rightbar" hidden></aside>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <input class="modal-search" id="modal-search" type="search" placeholder="Search sections, pages and headings…" autocomplete="off">
      <ul class="pick-list" id="modal-list"></ul>
      <p class="modal-hint" id="modal-hint"></p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/vendor/quill/quill.js"></script>
  <script src="/js/slug.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/collab.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/relmap.js"></script>
  <script src="/js/history.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
